<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  镜像里没有 fontconfig 的默认配置时(librsvg 会报 "Cannot load default config file"),
  中文全部渲染成方块 —— 文字封面就是「看不清」。
  这里给一份最小配置:只认 /usr/share/fonts,Dockerfile 会把 
  DejaVuSans(Latin) + DroidSansFallbackFull(CJK) 拷进去。
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
