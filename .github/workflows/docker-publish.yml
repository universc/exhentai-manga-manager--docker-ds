name: Docker Publish

# 在 GitHub Actions 上构建并推送 Docker Hub。
# 本机/NAS 所在网络无法直连 Docker Hub（SNI 阻断），因此由 Actions 代推。
# 需要仓库 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            universc/exhentai-manga-manager--docker-ds:${{ steps.ver.outputs.version }}
            universc/exhentai-manga-manager--docker-ds:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
