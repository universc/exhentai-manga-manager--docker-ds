# ============================================================
# exhentai-manga-manager 缃戦〉鐗?- Docker Compose 閰嶇疆
#
# 鐢ㄦ硶:
#   1. 鎶婃暣涓」鐩枃浠跺す浼犲埌椋炵墰 NAS(渚嬪 /vol1/1000/docker/exhentai-manga-manager)
#   2. 淇敼涓嬫柟 volumes 涓殑婕敾搴?鏁版嵁鐩綍涓轰綘 NAS 涓婄殑瀹為檯璺緞
#   3. SSH 鐧诲綍 NAS 鍚庢墽琛? docker compose up -d --build
#   4. 娴忚鍣ㄨ闂?http://NAS鐨処P:10000
#
# 鎴栧湪椋炵墰 fnOS 鐨?搴旂敤鍟嗗簵 鈫?鑷畾涔夊簲鐢ㄤ腑绮樿创鏈枃浠?闇€鍏堟墜鍔ㄦ瀯寤洪暅鍍?
# 璇﹁ docker/README.md 鏂规 B)銆?#
# 鏈満宸查儴缃茬殑璺緞(鎸夐渶淇敼):
#   鏁版嵁鐩綍: /vol3/1000/01/01-婕敾/S/鏁版嵁瀛樻斁 鈫?瀹瑰櫒 /data
#   婕敾搴?   /vol3/1000/01/01-婕敾             鈫?瀹瑰櫒 /library
# ============================================================
services:
  exhentai-manga-manager:
    build: .
    image: exhentai-manga-manager:1.10.0
    container_name: exhentai-manga-manager
    restart: unless-stopped

    ports:
      # 缃戦〉绠＄悊鐣岄潰(鐢佃剳/鎵嬫満娴忚鍣ㄨ闂?
      - "10000:10000"

    environment:
      # 鏁版嵁鐩綍(璁剧疆銆乻qlite 鏁版嵁搴撱€佸皝闈€侀槄璇荤紦瀛樸€佹棩蹇?
      WEB_DATA_DIR: /data
      # 榛樿婕敾搴撹矾寰?棣栨鍚姩浼氬啓鍏?setting.json;
      # 涔嬪悗鍙湪缃戦〉 璁剧疆 鈫?婕敾搴?涓敼涓?/library 涓嬬殑浠绘剰瀛愮洰褰?      LIBRARY_DIR: /library
      # 瀹瑰櫒妯″紡:寮哄埗搴撹矾寰勪负 /library,骞跺吋瀹?Windows 鍏变韩鏁版嵁搴撶殑璺緞浜掕瘧
      WEB_LIBRARY: /library
      WEB_PORT: "10000"
      # 璐︽埛绯荤粺:棣栨鍚姩鏃剁敤浠ヤ笅鍙橀噺鍒涘缓绠＄悊鍛樿处鎴?
      # 涔嬪悗鍙湪缃戦〉 璁剧疆 鈫?璐︽埛 涓鐞?娣诲姞鍙鐨勬櫘閫氳处鎴?/ 鍒犻櫎 / 閲嶇疆瀵嗙爜)銆?      # 涓嶉厤缃垯璐︽埛绯荤粺涓嶅惎鐢?淇濇寔鍖垮悕璁块棶銆?      WEB_ADMIN_USER: ${WEB_ADMIN_USER:-universc}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:?请在 .env 中设置}
      # 鏃跺尯,鎸夐渶淇敼
      TZ: Asia/Shanghai

    volumes:
      # 鏁版嵁鎸佷箙鍖?鏁版嵁搴?灏侀潰/璁剧疆)
      - /vol3/1000/01/01-婕敾/S/鏁版嵁瀛樻斁:/data
      # 婕敾搴?      - /vol3/1000/01/01-婕敾:/library
